name: Android app

# Builds the VYBE Android app and attaches the APK to a GitHub Release, so it
# installs straight from this repo's Releases page — no Play Store involved.
#
#   git tag v1.0.0 && git push origin v1.0.0     builds and publishes a release
#   Actions tab -> Android app -> Run workflow    builds an APK you can download from the run
#
# One-time setup, under Settings -> Secrets and variables -> Actions:
#   Secrets   ANDROID_KEYSTORE_BASE64    the signing keystore, base64-encoded
#             ANDROID_KEYSTORE_PASSWORD
#             ANDROID_KEY_ALIAS
#             ANDROID_KEY_PASSWORD
# Without the secrets it still builds, but signed with a throwaway debug key —
# see the README's "Android app" section for why that matters.
# The app opens the GitHub Pages site (https://<user>.github.io/<repo>/); set a
# repository variable VYBE_APP_URL only if you host it somewhere else.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # to create the release

jobs:
  apk:
    runs-on: ubuntu-latest
    env:
      VYBE_APP_URL: ${{ vars.VYBE_APP_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}
      VYBE_VERSION_CODE: ${{ github.run_number }}
      VYBE_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('0.0.{0}', github.run_number) }}
    steps:
      - uses: actions/checkout@v4

      - name: Show which site the app opens
        run: echo "VYBE app → $VYBE_APP_URL"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Point the app at the site and sync plugins
        run: npm run android:sync

      - name: Restore signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/vybe.keystore"
            echo "VYBE_KEYSTORE=$RUNNER_TEMP/vybe.keystore" >> "$GITHUB_ENV"
          elif [ "$GITHUB_REF_TYPE" = "tag" ]; then
            # A release people install and later update from must always be
            # signed with the same key, so don't publish one without it.
            echo "::error::Releases need your signing key so updates install over the old version. Add the ANDROID_KEYSTORE_* secrets (README → Android app), or use Run workflow for a test build."
            exit 1
          else
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret, so this test APK is signed with a throwaway debug key. It installs fine, but later builds won't install over it — you'd have to uninstall first, which deletes My Files."
          fi

      - name: Build APK
        working-directory: android
        env:
          VYBE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VYBE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          VYBE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -n "$VYBE_KEYSTORE" ]; then
            ./gradlew --no-daemon assembleRelease
            cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/vybe-$VYBE_VERSION_NAME.apk"
          else
            ./gradlew --no-daemon assembleDebug
            cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/vybe-$VYBE_VERSION_NAME.apk"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: vybe-apk
          path: vybe-*.apk

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: vybe-*.apk
          body: |
            Open this page on your Android phone, download **vybe-${{ github.ref_name }}.apk**, and tap it to install. Android asks once for permission to install apps from your browser — allow it.

            Already have VYBE? This installs over it and keeps your playlists and My Files.
